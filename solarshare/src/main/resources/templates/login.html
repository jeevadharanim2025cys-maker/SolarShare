<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - SolarShare</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f5132, #198754);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", sans-serif;
        }

        .login-box {
            width: 400px;
            max-width: 92%;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0,0,0,.18);
        }

        .logo {
            width: 60px;
            height: 60px;
            background: #ffd43b;
            color: #0f5132;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 15px;
        }

        h2 {
            font-weight: 700;
        }

        .subtitle {
            color: #718078;
            font-size: 14px;
        }

        .form-control {
            padding: 12px;
            border-radius: 10px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #198754;
            color: white;
            font-weight: 600;
        }

        .login-btn:hover {
            background: #146c43;
        }

        #message {
            display: none;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        ☀
    </div>

    <div class="text-center mb-4">

        <h2>SolarShare</h2>

        <p class="subtitle">
            Community Rooftop Solar Usage Tracker
        </p>

    </div>


    <form id="loginForm">

        <div class="mb-3">

            <label class="form-label">
                Username
            </label>

            <input
                type="text"
                id="username"
                class="form-control"
                placeholder="Enter username"
                required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Enter password"
                required>

        </div>


        <button
            type="submit"
            class="login-btn">

            Login

        </button>

    </form>


    <div id="message"></div>

</div>


<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const username =
            document.getElementById("username").value;

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");


        try {

            const response =
                await fetch("/api/users");

            const users =
                await response.json();


            const user =
                users.find(
                    u =>
                        u.username === username &&
                        u.password === password
                );


            if (!user) {

                message.textContent =
                    "Invalid username or password.";

                message.style.display = "block";
                message.style.background = "#ffe7e7";
                message.style.color = "#b02a37";

                return;
            }


            sessionStorage.setItem(
                "solarShareUser",
                user.username
            );


            window.location.href =
                "/dashboard";


        } catch (error) {

            message.textContent =
                "Unable to connect to the server.";

            message.style.display = "block";
            message.style.background = "#ffe7e7";
            message.style.color = "#b02a37";

        }

    });

</script>

</body>
</html>
